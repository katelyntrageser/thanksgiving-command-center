<!DOCTYPE html><html><head><meta charset='utf-8'><title>Thanksgiving Ping Pong Championship</title><link rel='stylesheet' href='styles.css'>
<style>
.teams{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px}.teamcard{background:#fff;padding:20px;border-radius:16px;box-shadow:0 8px 20px rgba(0,0,0,.1);border-top:8px solid var(--accent)}.round h3{text-align:center}.pick{display:block;width:100%;margin:6px 0;padding:12px;border:none;border-radius:10px;cursor:pointer;font-weight:700;color:#222}.winner-path{outline:4px solid #4caf50}.history{max-height:300px;overflow:auto}.champ-modal{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;z-index:9999}.champ-box{background:white;padding:40px;border-radius:24px;text-align:center;max-width:700px;width:90%;box-shadow:0 0 40px rgba(244,185,66,.7)}.closebtn{margin-top:20px}.hidden{display:none}
</style></head><body>
<header class='hero'><h1>🏓 Thanksgiving Ping Pong Championship</h1><p>10 Players • 5 Teams • 1 Champion</p></header>
<div class='container'>
<div class='dashboard'>
<div class='stat-card'><div class='stat-title'>Teams</div><div class='stat-value'>5</div></div>
<div class='stat-card'><div class='stat-title'>Matches Played</div><div class='stat-value' id='played'>0</div></div>
<div class='stat-card'><div class='stat-title'>Current Round</div><div class='stat-value' id='round'>Setup</div></div>
<div class='stat-card'><div class='stat-title'>Champion</div><div class='stat-value' id='champion'>TBD</div></div>
</div>
<div class='card'><button class='btn' onclick='drawTeams()'>🎲 Draw Teams</button> <button class='btn btn-secondary' onclick='resetTournament()'>🔄 Start New Tournament</button></div>
<div class='card'><h2>Teams</h2><div id='teams' class='teams'></div></div>
<div class='card'><h2>Bracket</h2><div id='bracket' class='bracket'></div></div>
<div class='card'><h2>Match History</h2><div id='history' class='history'></div></div>
</div>
<div id='modal' class='champ-modal hidden'><div id='champBox' class='champ-box'></div></div>
<script>
const players=['Tim','Beth','Jerome','Katelyn','John','Mary Dudley','Robbie','Sawyer','Mary Grace','Brody'];
const defs=[['Turkey Toppers','#dd6e42'],['Stuffing Smashers','#912f40'],['Wishbone Warriors','#7d8f69'],['Pumpkin Power','#f4b942'],['Cranberry Crushers','#6d1f2f'],['Pie Pushers','#b57a44'],['Harvest Hustlers','#c96a2d'],['Gobble Squad','#56734d'],['Pilgrim Paddlers','#9c6b30'],['Mashed Potato Masters','#c8aa6e']];
let T=JSON.parse(localStorage.getItem('tt2026v2')||'null');
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function save(){localStorage.setItem('tt2026v2',JSON.stringify(T));}
function log(m){T.history.unshift(new Date().toLocaleTimeString()+': '+m)}
function drawTeams(){let p=shuffle(players),n=shuffle(defs);let teams=[];for(let i=0;i<5;i++)teams.push({name:n[i][0],color:n[i][1],players:[p[i*2],p[i*2+1]]});T={teams,played:0,history:[],r1:[null,null],semiA:null,finalA:null,champ:null};log('Teams drawn');save();render();}
function r1(match,idx){T.r1[match]=T.teams[idx];T.played++;log(T.teams[idx].name+' won Round 1');save();render();}
function semi(choice){T.semiA=choice;T.played++;log(choice.name+' won semifinal');save();render();}
function finalA(choice){T.finalA=choice;T.played++;log(choice.name+' reached final');save();render();}
function championPick(choice){T.champ=choice;T.played++;log(choice.name+' won championship');save();render();}
function showChampion(){modal.classList.remove('hidden');champBox.innerHTML=`<div style="border-top:12px solid ${T.champ.color}"><h1>🏆</h1><h2>2026 Thanksgiving Champions</h2><h1>${T.champ.name}</h1><p>${T.champ.players.join(' & ')}</p><button class='btn closebtn' onclick='modal.classList.add("hidden")'>Close</button></div>`;}
function render(){if(!T)return;played.textContent=T.played;champion.textContent=T.champ?T.champ.name:'TBD';round.textContent=T.champ?'Complete':T.finalA?'Championship':T.semiA?'Final Qualifier':'Round 1';teams.innerHTML=T.teams.map(t=>`<div class='teamcard' style='--accent:${t.color}'><h3>${t.name}</h3><p>${t.players[0]}<br>&<br>${t.players[1]}</p></div>`).join('');
let bye=T.teams[4];
bracket.innerHTML=`<div class='round'><h3>Round 1</h3><div class='match'>${T.r1[0]?'<div class="winner-path">'+T.r1[0].name+'</div>':`<button class='pick' style='background:${T.teams[0].color}' onclick='r1(0,0)'>${T.teams[0].name}</button><button class='pick' style='background:${T.teams[1].color}' onclick='r1(0,1)'>${T.teams[1].name}</button>`}</div><div class='match'>${T.r1[1]?'<div class="winner-path">'+T.r1[1].name+'</div>':`<button class='pick' style='background:${T.teams[2].color}' onclick='r1(1,2)'>${T.teams[2].name}</button><button class='pick' style='background:${T.teams[3].color}' onclick='r1(1,3)'>${T.teams[3].name}</button>`}</div><div class='match'><strong>${bye.name}</strong><br>Bye to Semifinal</div></div>
<div class='round'><h3>Semifinal</h3><div class='match'>${T.r1[0]&&!T.semiA?`<button class='pick' style='background:${T.r1[0].color}' onclick='semi(T.r1[0])'>${T.r1[0].name}</button><button class='pick' style='background:${bye.color}' onclick='semi(T.teams[4])'>${bye.name}</button>`:(T.semiA?'<div class="winner-path">'+T.semiA.name+'</div>':'Waiting')}</div><div class='match'>${T.r1[1]&&!T.finalA?`<button class='pick' style='background:${T.r1[1].color}' onclick='finalA(T.r1[1])'>${T.r1[1].name}</button>`:(T.finalA?'<div class="winner-path">'+T.finalA.name+'</div>':'Waiting')}</div></div>
<div class='round'><h3>Championship</h3><div class='match'>${T.semiA&&T.finalA&&!T.champ?`<button class='pick' style='background:${T.semiA.color}' onclick='championPick(T.semiA)'>${T.semiA.name}</button><button class='pick' style='background:${T.finalA.color}' onclick='championPick(T.finalA)'>${T.finalA.name}</button>`:(T.champ?'<div class="winner-path">🏆 '+T.champ.name+'</div>':'Waiting')}</div></div>`;
history.innerHTML=T.history.map(x=>'<div>'+x+'</div>').join('');if(T.champ)showChampion();}
function resetTournament(){localStorage.removeItem('tt2026v2');location.reload();}
if(T)render();
</script></body></html>
