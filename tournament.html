<!DOCTYPE html><html><head><meta charset='UTF-8'><title>Ping Pong Championship</title><link rel='stylesheet' href='styles.css'></head><body><h1>🏓 Thanksgiving Ping Pong Championship</h1><button onclick='gen()'>Generate Teams</button><button onclick='resetT()'>Reset Tournament</button><div id='teams' class='card'></div><div id='bracket' class='card'></div><div id='champ'></div><div id='history' class='card'></div><script>const p=['Tim','Beth','Jerome','Katelyn','John','Mary Dudley','Robbie','Sawyer','Mary Grace','Brody'];const names=['Turkey Toppers','Gravy Smashers','Cranberry Crushers','Stuffing Strikers','Pumpkin Power'];let state=JSON.parse(localStorage.getItem('tt2026')||'null');function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}function save(){localStorage.setItem('tt2026',JSON.stringify(state));}function gen(){let s=shuffle([...p]);state={teams:[],hist:[]};for(let i=0;i<5;i++)state.teams.push({name:names[i],players:[s[i*2],s[i*2+1]]});save();render();}function render(){if(!state)return;teams.innerHTML='<h2>Teams</h2>'+state.teams.map((t,i)=>`<p>${i+1}. <b>${t.name}</b>: ${t.players.join(' & ')}</p>`).join('');let html='<h2>Bracket</h2>';let advance=[0,2,4];html+=state.teams.map((t,i)=>`<button onclick="win(${i})">Win: ${t.name}</button><br>`).join('');bracket.innerHTML=html;history.innerHTML='<h2>Match History</h2>'+state.hist.join('<br>');}function win(i){let w=state.teams[i].name;state.hist.push(w+' advanced');if(state.hist.length>=4){champ.innerHTML='<div class="champ">🏆 Champion: '+w+' 🎉</div>';document.body.classList.add('confetti');}save();render();}function resetT(){localStorage.removeItem('tt2026');state=null;location.reload();}render();</script></body></html>
