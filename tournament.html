<!DOCTYPE html><html><head><meta charset='utf-8'><title>Thanksgiving Ping Pong Championship</title><link rel='stylesheet' href='styles.css'>
<style>
.teams{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:24px}.teamcard{background:#fff;padding:22px;border-radius:18px;box-shadow:0 8px 20px rgba(0,0,0,.12);border-top:8px solid var(--accent)}.stage{background:#fff;padding:24px;border-radius:18px;box-shadow:0 8px 20px rgba(0,0,0,.1);margin-bottom:28px}.stage h3{text-align:center;margin-bottom:18px;color:#912f40}.matchup{background:#f8f1ea;padding:18px;border-radius:12px;margin:16px 0}.pick{display:block;width:100%;margin:8px 0;padding:14px;border:none;border-radius:10px;font-weight:700;cursor:pointer}.winner{outline:4px solid #4caf50}.champ-modal{position:fixed;inset:0;background:rgba(0,0,0,.78);backdrop-filter:blur(6px);display:flex;justify-content:center;align-items:center;z-index:9999}.champ-box{background:white;padding:50px;border-radius:28px;text-align:center;width:min(800px,90vw);box-shadow:0 0 50px rgba(244,185,66,.8)}.hidden{display:none}.format{font-size:1.1rem;line-height:1.8}
</style></head><body>
<header class='hero'><h1>🏓 Thanksgiving Ping Pong Championship</h1><p>10 Players • 5 Teams • 1 Champion</p></header>
<div class='container'>
<div class='dashboard'>
<div class='stat-card'><div class='stat-title'>Teams</div><div class='stat-value'>5</div></div>
<div class='stat-card'><div class='stat-title'>Matches Played</div><div class='stat-value' id='played'>0</div></div>
<div class='stat-card'><div class='stat-title'>Current Round</div><div class='stat-value' id='round'>Setup</div></div>
<div class='stat-card'><div class='stat-title'>Champion</div><div class='stat-value' id='champion'>TBD</div></div>
</div>
<div class='card'><button class='btn' onclick='drawTeams()'>🎲 Draw Teams</button> <button class='btn btn-secondary' onclick='resetTournament()'>🔄 Start New Tournament</button></div>
<div class='card'><h2>Tournament Format</h2><div class='format'>5 Teams<br>4 Matches<br>Single Elimination<br>One Team Leaves With Glory 🏆</div></div>
<div class='card'><h2>Teams</h2><div id='teams' class='teams'></div></div>
<div id='stages'></div>
</div>
<div id='modal' class='champ-modal hidden'><div id='champBox' class='champ-box'></div></div>
<script>
const players=['Tim','Beth','Jerome','Katelyn','John','Mary Dudley','Robbie','Sawyer','Mary Grace','Brody'];
const defs=[['Turkey Toppers','#dd6e42'],['Stuffing Smashers','#912f40'],['Wishbone Warriors','#7d8f69'],['Pumpkin Power','#f4b942'],['Cranberry Crushers','#6d1f2f'],['Pie Pushers','#b57a44'],['Harvest Hustlers','#c96a2d'],['Gobble Squad','#56734d'],['Pilgrim Paddlers','#9c6b30'],['Mashed Potato Masters','#c8aa6e']];
let T=JSON.parse(localStorage.getItem('tt2026v3')||'null');
function sh(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function save(){localStorage.setItem('tt2026v3',JSON.stringify(T));}
function drawTeams(){let p=sh(players),n=sh(defs),teams=[];for(let i=0;i<5;i++)teams.push({name:n[i][0],color:n[i][1],players:[p[i*2],p[i*2+1]]});T={teams,played:0,r1:[null,null],semi:null,finalist:null,champ:null};save();render();}
function r1(m,i){T.r1[m]=T.teams[i];T.played++;save();render();}
function semiPick(team){T.semi=team;T.played++;save();render();}
function finalistPick(team){T.finalist=team;T.played++;save();render();}
function champPick(team){T.champ=team;T.played++;save();render();}
function showChamp(){modal.classList.remove('hidden');champBox.innerHTML=`<div style="border-top:14px solid ${T.champ.color}"><h1 style="font-size:5rem">🏆</h1><h2>2026 Thanksgiving Champions</h2><h1>${T.champ.name}</h1><h2>${T.champ.players.join(' & ')}</h2><button class='btn' onclick='modal.classList.add("hidden")'>Close</button></div>`;}
function render(){if(!T)return;played.textContent=T.played;champion.textContent=T.champ?T.champ.name:'TBD';round.textContent=T.champ?'Complete':T.finalist?'Championship':T.semi?'Final Qualifier':'Round 1';
teams.innerHTML=T.teams.map(t=>`<div class='teamcard' style='--accent:${t.color}'><h3>${t.name}</h3><p>${t.players[0]}<br>&<br>${t.players[1]}</p></div>`).join('');
let bye=T.teams[4];
stages.innerHTML=`<div class='stage'><h3>ROUND 1</h3><div class='matchup'>${T.r1[0]?`<div class='winner'>${T.r1[0].name}</div>`:`<button class='pick' style='background:${T.teams[0].color}' onclick='r1(0,0)'>${T.teams[0].name}</button><button class='pick' style='background:${T.teams[1].color}' onclick='r1(0,1)'>${T.teams[1].name}</button>`}</div><div class='matchup'>${T.r1[1]?`<div class='winner'>${T.r1[1].name}</div>`:`<button class='pick' style='background:${T.teams[2].color}' onclick='r1(1,2)'>${T.teams[2].name}</button><button class='pick' style='background:${T.teams[3].color}' onclick='r1(1,3)'>${T.teams[3].name}</button>`}</div><div class='matchup'><strong>${bye.name}</strong><br>Receives Bye</div></div>
<div class='stage'><h3>SEMIFINAL</h3><div class='matchup'>${T.r1[0]&&!T.semi?`<button class='pick' style='background:${T.r1[0].color}' onclick='semiPick(T.r1[0])'>${T.r1[0].name}</button><button class='pick' style='background:${bye.color}' onclick='semiPick(T.teams[4])'>${bye.name}</button>`:(T.semi?`<div class='winner'>${T.semi.name}</div>`:'Waiting for Round 1')}</div></div>
<div class='stage'><h3>FINAL QUALIFIER</h3><div class='matchup'>${T.r1[1]&&!T.finalist?`<button class='pick' style='background:${T.r1[1].color}' onclick='finalistPick(T.r1[1])'>${T.r1[1].name}</button>`:(T.finalist?`<div class='winner'>${T.finalist.name}</div>`:'Waiting for Round 1')}</div></div>
<div class='stage'><h3>CHAMPIONSHIP</h3><div class='matchup'>${T.semi&&T.finalist&&!T.champ?`<button class='pick' style='background:${T.semi.color}' onclick='champPick(T.semi)'>${T.semi.name}</button><button class='pick' style='background:${T.finalist.color}' onclick='champPick(T.finalist)'>${T.finalist.name}</button>`:(T.champ?`<div class='winner'>🏆 ${T.champ.name}</div>`:'Waiting')}</div></div>`;
if(T.champ)showChamp();}
function resetTournament(){localStorage.removeItem('tt2026v3');location.reload();}
if(T)render();
</script></body></html>
