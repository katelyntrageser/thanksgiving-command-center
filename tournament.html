<!DOCTYPE html><html><head><meta charset='utf-8'><title>Thanksgiving Championship</title><link rel='stylesheet' href='styles.css'><style>.teams{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px}.teamcard{background:#fff;padding:20px;border-radius:16px;box-shadow:0 8px 20px rgba(0,0,0,.1)}.round h3{text-align:center}.pick{display:block;width:100%;margin:6px 0;padding:10px;border:none;border-radius:10px;background:#f4ede7;cursor:pointer;font-weight:700}.pick:hover{background:#ffe2c9}.history{max-height:300px;overflow:auto}.champ{background:linear-gradient(135deg,#f4b942,#ffe082);padding:30px;border-radius:20px;text-align:center;margin-bottom:25px}</style></head><body><header class='hero'><h1>🏓 Thanksgiving Ping Pong Championship</h1><p>10 Players • 5 Teams • 1 Champion</p></header><div class='container'><div class='dashboard'><div class='stat-card'><div class='stat-title'>Teams</div><div class='stat-value'>5</div></div><div class='stat-card'><div class='stat-title'>Matches Played</div><div class='stat-value' id='played'>0</div></div><div class='stat-card'><div class='stat-title'>Current Round</div><div class='stat-value' id='round'>Setup</div></div><div class='stat-card'><div class='stat-title'>Champion</div><div class='stat-value' id='champion'>TBD</div></div></div><div class='card'><button class='btn' onclick='drawTeams()'>🎲 Draw Teams</button> <button class='btn btn-secondary' onclick='resetTournament()'>🔄 Start New Tournament</button></div><div id='champArea'></div><div class='card'><h2>Teams</h2><div id='teams' class='teams'></div></div><div class='card'><h2>Bracket</h2><div id='bracket' class='bracket'></div></div><div class='card'><h2>Match History</h2><div id='history' class='history'></div></div></div><script>const players=['Tim','Beth','Jerome','Katelyn','John','Mary Dudley','Robbie','Sawyer','Mary Grace','Brody'];const names=['Turkey Toppers','Stuffing Smashers','Wishbone Warriors','Pumpkin Power','Cranberry Crushers','Pie Pushers','Harvest Hustlers','Gobble Squad','Pilgrim Paddlers','Mashed Potato Masters'];let T=JSON.parse(localStorage.getItem('tt2026')||'null');function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}function save(){localStorage.setItem('tt2026',JSON.stringify(T));}function log(m){T.history.unshift(new Date().toLocaleTimeString()+': '+m);}function drawTeams(){let p=shuffle(players),n=shuffle(names);let teams=[];for(let i=0;i<5;i++)teams.push({name:n[i],players:[p[i*2],p[i*2+1]]});T={teams,history:[],played:0,r1:[null,null],sf:null,champ:null};log('Teams drawn');save();render();}function chooseR1(match,idx){T.r1[match]=T.teams[idx];T.played++;log(T.teams[idx].name+' advanced');save();render();}function chooseSF(which){T.sf=which;T.played++;log(which.name+' reached championship');save();render();}function chooseChamp(which){T.champ=which;T.played++;log(which.name+' won the championship');save();render();}function render(){if(!T)return;played.textContent=T.played;champion.textContent=T.champ?T.champ.name:'TBD';round.textContent=T.champ?'Complete':T.sf?'Championship':(T.r1[0]&&T.r1[1]?'Semifinal':'Round 1');teams.innerHTML=T.teams.map(t=>`<div class='teamcard'><h3>${t.name}</h3><p>${t.players[0]}<br>&<br>${t.players[1]}</p></div>`).join('');let bye=T.teams[4];bracket.innerHTML=`<div class='round'><h3>Round 1</h3><div class='match'>${!T.r1[0]?`<button class='pick' onclick='chooseR1(0,0)'>${T.teams[0].name}</button><button class='pick' onclick='chooseR1(0,1)'>${T.teams[1].name}</button>`:T.r1[0].name}</div><div class='match'>${!T.r1[1]?`<button class='pick' onclick='chooseR1(1,2)'>${T.teams[2].name}</button><button class='pick' onclick='chooseR1(1,3)'>${T.teams[3].name}</button>`:T.r1[1].name}</div><div class='match'><strong>${bye.name}</strong><br>Automatic Bye</div></div><div class='round'><h3>Semifinal</h3><div class='match'>${T.r1[0]&&T.r1[1]&&!T.sf?`<button class='pick' onclick='chooseSF(T.r1[0])'>${T.r1[0].name}</button><button class='pick' onclick='chooseSF(T.r1[1])'>${T.r1[1].name}</button>`:(T.sf?T.sf.name:'Waiting')}</div></div><div class='round'><h3>Championship</h3><div class='match'>${T.sf&&!T.champ?`<button class='pick' onclick='chooseChamp(T.sf)'>${T.sf.name}</button><button class='pick' onclick='chooseChamp(T.teams[4])'>${bye.name}</button>`:(T.champ?T.champ.name:'Waiting')}</div></div>`;history.innerHTML=T.history.map(x=>'<div>'+x+'</div>').join('');if(T.champ){champArea.innerHTML=`<div class='champ'><h2>🏆 2026 Thanksgiving Champions</h2><h1>${T.champ.name}</h1><p>${T.champ.players.join(' & ')}</p></div>`;}}function resetTournament(){localStorage.removeItem('tt2026');location.reload();}if(T)render();</script></body></html>
