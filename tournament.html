<!DOCTYPE html><html><head><meta charset='utf-8'><title>Tournament</title><link rel='stylesheet' href='styles.css'></head><body><header class='hero-small'><h1>🏓 Championship</h1></header><div class='container'><div class='card'><button class='btn' onclick='setup()'>Generate Teams</button></div><div id='champ'></div><div id='teams' class='card'></div><div id='bracket' class='card'></div></div><script>const p=['Tim','Beth','Jerome','Katelyn','John','Mary Dudley','Robbie','Sawyer','Mary Grace','Brody'];function s(a){return a.sort(()=>Math.random()-.5)};function setup(){let x=s([...p]);teams.innerHTML='';for(let i=0;i<5;i++)teams.innerHTML+=`<p>Team ${i+1}: ${x[i*2]} & ${x[i*2+1]}</p>`;bracket.innerHTML='<h2>Bracket Generated</h2><p>Select winners manually for game day!</p>';}</script></body></html>
